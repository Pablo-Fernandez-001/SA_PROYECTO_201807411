name: DeliverEats CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      operation:
        description: "Operacion a ejecutar"
        required: true
        default: deploy
        type: choice
        options:
          - deploy
          - rollback
      rollback_revision:
        description: "Revision de Kubernetes a restaurar. Deja vacio para volver a la anterior."
        required: false
        type: string
      rollback_frontend_revision:
        description: "Revision de Cloud Run para frontend. Deja vacio para no cambiar trafico."
        required: false
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GCP_PROJECT_ID: proyecto-sa-492706
  GKE_CLUSTER: proyecto-iac-gke
  GKE_ZONE: us-central1-a
  GCP_REGION: us-central1
  REGISTRY: us-central1-docker.pkg.dev
  ARTIFACT_REPOSITORY: delivereats
  FRONTEND_SERVICE: frontend
  K8S_NAMESPACE: delivereats
  K8S_DEPLOYMENTS: "api-gateway auth-service catalog-service orders-service delivery-service notification-service payment-service fx-service"

jobs:
  phase3-validation:
    name: Phase3 Terraform + Ansible + Smoke + Locust
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.operation != 'rollback'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform fmt normalize and verify
        working-directory: ./Proyecto3/iac/terraform
        run: |
          terraform fmt -recursive
          terraform fmt -check -recursive

      - name: Terraform init
        working-directory: ./Proyecto3/iac/terraform
        run: terraform init -backend=false

      - name: Terraform validate
        working-directory: ./Proyecto3/iac/terraform
        run: terraform validate

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ansible and Locust
        run: |
          python -m pip install --upgrade pip
          pip install ansible locust

      - name: Validate Ansible inventory + syntax
        run: |
          ansible-inventory -i Proyecto3/iac/ansible/inventory.example.ini --list > /tmp/inventory.json
          ansible-playbook -i Proyecto3/iac/ansible/inventory.example.ini Proyecto3/iac/ansible/site.yml --syntax-check

      - name: Run local smoke mock
        run: |
          mkdir -p Proyecto3/evidence/smoke
          chmod +x Proyecto3/tests/smoke/smoke.sh
          python Proyecto3/tests/smoke/mock_server.py &
          SERVER_PID=$!
          sleep 2
          API_GATEWAY_URL=http://localhost:8080 Proyecto3/tests/smoke/smoke.sh | tee Proyecto3/evidence/smoke/smoke-run.log
          kill $SERVER_PID

      - name: Run locust smoke load profile
        run: |
          mkdir -p Proyecto3/evidence/load
          chmod +x Proyecto3/tests/load/run-locust.sh
          python Proyecto3/tests/smoke/mock_server.py &
          SERVER_PID=$!
          sleep 2
          export RUN_TIME=45s
          Proyecto3/tests/load/run-locust.sh http://localhost:8080 Proyecto3/evidence/load
          python Proyecto3/tests/load/validate_thresholds.py Proyecto3/evidence/load/locust_stats.csv Proyecto3/evidence/load/performance-validation.md
          kill $SERVER_PID

      - name: Upload Phase 3 evidence artifacts
        uses: actions/upload-artifact@v4
        with:
          name: phase3-evidence
          path: |
            Proyecto3/evidence/smoke/*
            Proyecto3/evidence/load/*
            Proyecto3/evidence/cronjob/*
            Proyecto3/evidence/dashboards/*
            Proyecto3/evidence/screenshots/*

  lint:
    name: Code Linting
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.operation != 'rollback'
    needs: phase3-validation
    strategy:
      matrix:
        service:
          - api-gateway
          - auth-service
          - catalog-service
          - orders-service
          - delivery-service
          - notification-service
          - payment-service
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: ./Proyecto3/${{ matrix.service }}/package-lock.json

      - name: Install dependencies
        working-directory: ./Proyecto3/${{ matrix.service }}
        run: npm ci || npm install

      - name: Run lint
        working-directory: ./Proyecto3/${{ matrix.service }}
        run: npm run lint || echo "No lint script found"

  test:
    name: Unit Testing
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.operation != 'rollback'
    needs: phase3-validation
    strategy:
      matrix:
        service:
          - api-gateway
          - auth-service
          - catalog-service
          - orders-service
          - delivery-service
          - notification-service
          - payment-service
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: ./Proyecto3/${{ matrix.service }}/package-lock.json

      - name: Install dependencies
        working-directory: ./Proyecto3/${{ matrix.service }}
        run: npm ci || npm install

      - name: Run unit tests
        working-directory: ./Proyecto3/${{ matrix.service }}
        run: npm test || echo "No tests found"

  security-audit:
    name: Security & NPM Audit
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.operation != 'rollback'
    needs: phase3-validation
    strategy:
      matrix:
        service:
          - api-gateway
          - auth-service
          - catalog-service
          - orders-service
          - delivery-service
          - notification-service
          - payment-service
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: ./Proyecto3/${{ matrix.service }}/package-lock.json

      - name: Install dependencies
        working-directory: ./Proyecto3/${{ matrix.service }}
        run: npm ci || npm install

      - name: Run npm audit
        working-directory: ./Proyecto3/${{ matrix.service }}
        run: npm audit --audit-level=high || true

  build-and-push:
    name: Build Docker Images
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.operation != 'rollback'
    needs: [lint, test, security-audit]
    strategy:
      matrix:
        service:
          - api-gateway
          - auth-service
          - catalog-service
          - orders-service
          - delivery-service
          - notification-service
          - payment-service
          - fx-service
          - frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Configure Docker auth
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./Proyecto3
          file: ./Proyecto3/${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPOSITORY }}/${{ matrix.service }}:${{ github.sha }}

  deploy:
    name: Deploy to Cloud
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.operation == 'deploy'
    needs: [build-and-push]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Deploy frontend to Cloud Run
        run: |
          gcloud run deploy ${{ env.FRONTEND_SERVICE }} \
            --image ${{ env.REGISTRY }}/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPOSITORY }}/frontend:${{ github.sha }} \
            --region ${{ env.GCP_REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --project ${{ env.GCP_PROJECT_ID }}

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GKE_ZONE }}
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Apply manifests and update images
        shell: bash
        run: |
          kubectl apply -f Proyecto3/k8s/ -n ${{ env.K8S_NAMESPACE }}

          for svc in ${{ env.K8S_DEPLOYMENTS }}; do
            kubectl set image deployment/$svc $svc=${{ env.REGISTRY }}/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPOSITORY }}/$svc:${{ github.sha }} -n ${{ env.K8S_NAMESPACE }}
          done

      - name: Wait for deployments
        shell: bash
        run: |
          for svc in ${{ env.K8S_DEPLOYMENTS }}; do
            kubectl rollout status deployment/$svc -n ${{ env.K8S_NAMESPACE }} --timeout=12m
          done

      - name: Apply monitoring stack
        run: |
          kubectl apply -f Proyecto3/monitoring/prometheus/k8s-prometheus.yaml
          kubectl apply -f Proyecto3/monitoring/grafana/k8s-grafana.yaml
          kubectl apply -f Proyecto3/monitoring/elk/elasticsearch.yaml
          kubectl apply -f Proyecto3/monitoring/elk/kibana.yaml
          kubectl apply -f Proyecto3/monitoring/elk/k8s-fluent-bit.yaml

      - name: Verify deployment
        run: |
          kubectl get pods -n ${{ env.K8S_NAMESPACE }}
          kubectl get svc -n ${{ env.K8S_NAMESPACE }}

  rollback:
    name: Rollback GKE
    runs-on: ubuntu-latest
    if: |
      always() &&
      (
        (github.event_name == 'workflow_dispatch' && github.event.inputs.operation == 'rollback') ||
        (github.event_name != 'workflow_dispatch' && needs.deploy.result == 'failure')
      )
    needs:
      - deploy
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GKE_ZONE }}
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Show rollout history before rollback
        shell: bash
        run: |
          for svc in ${{ env.K8S_DEPLOYMENTS }}; do
            echo "=== History for $svc ==="
            kubectl rollout history deployment/$svc -n ${{ env.K8S_NAMESPACE }} || true
          done

      - name: Rollback Kubernetes deployments
        shell: bash
        run: |
          REVISION="${{ github.event.inputs.rollback_revision }}"
          for svc in ${{ env.K8S_DEPLOYMENTS }}; do
            echo "Rolling back $svc"
            if [[ -n "$REVISION" ]]; then
              kubectl rollout undo deployment/$svc -n ${{ env.K8S_NAMESPACE }} --to-revision="$REVISION"
            else
              kubectl rollout undo deployment/$svc -n ${{ env.K8S_NAMESPACE }}
            fi
          done

      - name: Wait for rollback completion
        shell: bash
        run: |
          for svc in ${{ env.K8S_DEPLOYMENTS }}; do
            kubectl rollout status deployment/$svc -n ${{ env.K8S_NAMESPACE }} --timeout=12m
          done

      - name: Rollback Cloud Run frontend traffic
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.rollback_frontend_revision != ''
        run: |
          gcloud run services update-traffic ${{ env.FRONTEND_SERVICE }} \
            --region ${{ env.GCP_REGION }} \
            --to-revisions ${{ github.event.inputs.rollback_frontend_revision }}=100 \
            --project ${{ env.GCP_PROJECT_ID }}

      - name: Verify rollback
        run: |
          kubectl get pods -n ${{ env.K8S_NAMESPACE }}
          kubectl get rs -n ${{ env.K8S_NAMESPACE }}
