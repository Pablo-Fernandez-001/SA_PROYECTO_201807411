apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: delivereats
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: "/metrics"
    prometheus.io/port: "80"
spec:
  replicas: 3
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
      - name: api-gateway
        image: us-central1-docker.pkg.dev/proyecto-sa-492706/delivereats/api-gateway:v1.0.0
        ports:
        - containerPort: 3000
          name: http
        env:
        - name: FRONTEND_URL
          valueFrom:
            configMapKeyRef:
              name: api-gateway-config
              key: FRONTEND_URL
        - name: NODE_ENV
          valueFrom:
            configMapKeyRef:
              name: api-gateway-config
              key: NODE_ENV
        - name: PORT
          valueFrom:
            configMapKeyRef:
              name: api-gateway-config
              key: PORT
        - name: AUTH_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: api-gateway-config
              key: AUTH_SERVICE_URL
        - name: CATALOG_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: api-gateway-config
              key: CATALOG_SERVICE_URL
        - name: ORDERS_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: api-gateway-config
              key: ORDERS_SERVICE_URL
        - name: DELIVERY_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: api-gateway-config
              key: DELIVERY_SERVICE_URL
        - name: GRAFANA_URL
          valueFrom:
            configMapKeyRef:
              name: api-gateway-config
              key: GRAFANA_URL
        - name: KIBANA_URL
          valueFrom:
            configMapKeyRef:
              name: api-gateway-config
              key: KIBANA_URL
        - name: PROMETHEUS_URL
          valueFrom:
            configMapKeyRef:
              name: api-gateway-config
              key: PROMETHEUS_URL
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: jwt-secret
              key: JWT_SECRET
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: delivereats
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: "/metrics"
    prometheus.io/port: "80"
spec:
  type: LoadBalancer
  loadBalancerIP: 34.67.27.144  # <--- Debe ir aquí, al nivel de spec
  selector:
    app: api-gateway            # <--- El selector solo debe tener las etiquetas del pod
  ports:
  - protocol: TCP
    port: 80
    targetPort: 3000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-gateway-hpa
  namespace: delivereats
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-gateway
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
