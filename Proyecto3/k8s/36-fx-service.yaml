apiVersion: apps/v1
kind: Deployment
metadata:
  name: fx-service
  namespace: delivereats
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fx-service
  template:
    metadata:
      labels:
        app: fx-service
    spec:
      containers:
      - name: fx-service
        image: us-central1-docker.pkg.dev/proyecto-sa-492706/delivereats/fx-service:v1.0
        ports:
        - containerPort: 5000
          name: http
        - containerPort: 50053
          name: grpc
        env:
        - name: REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: fx-service-config
              key: REDIS_HOST
        - name: REDIS_PORT
          valueFrom:
            configMapKeyRef:
              name: fx-service-config
              key: REDIS_PORT
        - name: REDIS_DB
          valueFrom:
            configMapKeyRef:
              name: fx-service-config
              key: REDIS_DB
        - name: GRPC_PORT
          valueFrom:
            configMapKeyRef:
              name: fx-service-config
              key: GRPC_PORT
        - name: GRPC_MAX_WORKERS
          valueFrom:
            configMapKeyRef:
              name: fx-service-config
              key: GRPC_MAX_WORKERS
        - name: FLASK_HOST
          valueFrom:
            configMapKeyRef:
              name: fx-service-config
              key: FLASK_HOST
        - name: FLASK_PORT
          valueFrom:
            configMapKeyRef:
              name: fx-service-config
              key: FLASK_PORT
        - name: FLASK_DEBUG
          valueFrom:
            configMapKeyRef:
              name: fx-service-config
              key: FLASK_DEBUG
        - name: FX_API_BASE_URL
          valueFrom:
            configMapKeyRef:
              name: fx-service-config
              key: FX_API_BASE_URL
        - name: FX_API_TIMEOUT
          valueFrom:
            configMapKeyRef:
              name: fx-service-config
              key: FX_API_TIMEOUT
        - name: CACHE_TTL
          valueFrom:
            configMapKeyRef:
              name: fx-service-config
              key: CACHE_TTL
        - name: FALLBACK_TTL
          valueFrom:
            configMapKeyRef:
              name: fx-service-config
              key: FALLBACK_TTL
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: fx-service-config
              key: LOG_LEVEL
        resources:
          requests:
            memory: "256Mi"
            cpu: "150m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 15
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: fx-service
  namespace: delivereats
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: "/metrics"
    prometheus.io/port: "5000"
spec:
  selector:
    app: fx-service
  ports:
  - protocol: TCP
    name: http
    port: 5000
    targetPort: 5000
  - protocol: TCP
    name: grpc
    port: 50053
    targetPort: 50053
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: fx-service-hpa
  namespace: delivereats
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: fx-service
  minReplicas: 1
  maxReplicas: 2
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
