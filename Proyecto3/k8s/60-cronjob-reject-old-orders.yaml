apiVersion: batch/v1
kind: CronJob
metadata:
  name: reject-stale-orders
  namespace: delivereats
spec:
  schedule: "0 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 86400
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: reject-stale-orders
              image: curlimages/curl:8.7.1
              imagePullPolicy: IfNotPresent
              env:
                - name: API_GATEWAY_URL
                  valueFrom:
                    configMapKeyRef:
                      name: delivereats-config
                      key: apiGatewayUrl
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  echo "[$(date)] Starting stale orders rejection..."
                  
                  # Call using environment variable
                  API_URL="${API_GATEWAY_URL}/api/orders/reject-stale"
                  
                  curl -fsS \
                    --max-time 30 \
                    --retry 2 \
                    -X POST "$API_URL" \
                    -H "Content-Type: application/json" && \
                    echo "[$(date)] ✓ Stale orders rejection completed" || \
                    echo "[$(date)] ✗ Stale orders rejection failed"
              resources:
                requests:
                  cpu: "50m"
                  memory: "64Mi"
                limits:
                  cpu: "200m"
                  memory: "256Mi"
