[SERVICE]
    Flush 1
    Daemon Off
    Log_Level info

[INPUT]
    Name tail
    Path /var/log/containers/*.log
    Parser docker
    Tag kube.*

[FILTER]
    Name kubernetes
    Match kube.*
    Merge_Log On
    Keep_Log Off

[OUTPUT]
    Name es
    Match *
    Host elasticsearch
    Port 9200
    Index delivereats-logs
    Type _doc
