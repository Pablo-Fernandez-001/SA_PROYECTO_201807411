[SERVICE]
    Flush              1
    Daemon             Off
    Log_Level          info
    Parsers_File       parsers.conf

[INPUT]
    Name               tail
    Path               /var/log/containers/*.log
    Parser             cri
    Tag                kube.*
    Refresh_Interval   5
    Mem_Buf_Limit      50MB
    Skip_Long_Lines    On

[FILTER]
    Name                kubernetes
    Match               kube.*
    Kube_URL            https://kubernetes.default.svc:443
    Kube_Tag_Prefix     kube.var.log.containers.
    Merge_Log           On
    Merge_Log_Key       log_processed
    Keep_Log            Off
    K8S-Logging.Parser  On
    Labels              On
    Annotations         Off

[OUTPUT]
    Name                es
    Match               kube.*
    Host                elasticsearch
    Port                9200
    Logstash_Format     On
    Logstash_Prefix     delivereats-logs
    Retry_Limit         False
    Suppress_Type_Name  On
    Replace_Dots        On
