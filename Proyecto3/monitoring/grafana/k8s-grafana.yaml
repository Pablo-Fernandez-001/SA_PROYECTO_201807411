apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: delivereats
data:
  datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus-delivereats
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: true

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: delivereats
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: DeliverEats
        orgId: 1
        folder: DeliverEats
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards
---
